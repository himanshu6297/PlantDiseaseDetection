services:
  - type: web
    name: plant-disease-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: MODEL_PATH
        value: Final_PlantVillage38_model.keras
      - key: ENVIRONMENT
        value: production
